name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage
        run: |
          python -m pytest --cov=isaac_starter_lab --cov-report=term-missing \
            --cov-report=json:coverage.json --cov-fail-under=85
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: error

  lab:
    name: headless lab + guide commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Run the headless lab
        run: make lab-headless
      - name: Grade every artifact
        run: labcheck all
      - name: Validate Mermaid diagrams
        run: python scripts/check_mermaid.py
      - name: Execute every marked guide command
        run: python scripts/extract_guide_commands.py
      - name: Upload lab output
        uses: actions/upload-artifact@v4
        with:
          name: headless-lab-output
          path: |
            artifacts/
            results/
            datasets/dr/manifest.json
            demo/frames/
          if-no-files-found: error

  determinism:
    name: determinism (two full runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Run the lab twice and compare artifact hashes
        run: python scripts/check_determinism.py
      - name: Upload determinism report
        uses: actions/upload-artifact@v4
        with:
          name: determinism-report
          path: results/determinism.json
          if-no-files-found: error

  docker:
    name: docker lab image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU lab image
        run: docker build --platform linux/amd64 -f docker/Dockerfile.lab -t isaac-starter-lab:ci .
      - name: Run the headless lab inside the image
        run: docker run --rm isaac-starter-lab:ci

  # GPU-GATED AND NOT RUN BY THIS REPOSITORY.
  # This job is intentionally skipped unless a repository variable
  # ENABLE_GPU_JOB=true is set and a self-hosted NVIDIA runner with these labels
  # is registered. It is documented so the GPU lane has a real CI home, not
  # because this build executed it. The build machine has no NVIDIA GPU.
  gpu-isaac:
    name: GPU Isaac Sim track (placeholder, unrun)
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_GPU_JOB == 'true'
    runs-on: [self-hosted, linux, x64, nvidia-gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Build the GPU image
        run: docker build -f docker/Dockerfile.isaac -t isaac-starter-lab:gpu .
      - name: Run the GPU episode
        run: |
          docker run --rm --gpus all --network host \
            -e ACCEPT_EULA=Y -e PRIVACY_CONSENT=Y \
            -e LAB_BACKEND=isaac -e LAB_BRIDGE=ros2 \
            -v "$HOME/.cache/ov:/root/.cache/ov" \
            -v "$HOME/.cache/pip:/root/.cache/pip" \
            -v "$HOME/.cache/nvidia:/root/.cache/nvidia" \
            -v "$HOME/.local/share/ov:/root/.local/share/ov" \
            -v "$PWD/artifacts:/lab/artifacts" \
            isaac-starter-lab:gpu \
            bash -lc 'lab-scene --seed 7 --out artifacts/scene_seed7.usda --force && lab-episode --seed 7 --backend isaac --bridge ros2 --out artifacts/episodes/gpu_seed_7'
